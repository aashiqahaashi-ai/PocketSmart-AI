{% extends "base.html" %}
{% block title %}Login - PocketSmart AI{% endblock %}
{% block content %}
<div class="auth-card">
<h1>Welcome back</h1><p>Login to your PocketSmart AI account.</p>
<form id="loginForm">
<label>Email<input type="email" name="email" required></label>
<label>Password<input type="password" name="password" required></label>
<button class="btn" type="submit">Login</button>
<p id="message" class="message"></p>
</form>
<p>New user? <a href="/register">Create an account</a></p>
</div>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e)=>{
 e.preventDefault(); const f=new FormData(e.target);
 const r=await fetch("/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(f))});
 const d=await r.json(); if(r.ok) location.href="/dashboard"; else document.getElementById("message").textContent=d.detail||"Login failed.";
});
</script>
{% endblock %}
