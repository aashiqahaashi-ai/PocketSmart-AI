{% extends "base.html" %}
{% block title %}Register - PocketSmart AI{% endblock %}
{% block content %}
<div class="auth-card">
<h1>Create account</h1><p>Start planning your budget with AI.</p>
<form id="registerForm">
<label>Name<input name="name" required minlength="2"></label>
<label>Email<input type="email" name="email" required></label>
<label>Password<input type="password" name="password" required minlength="6"></label>
<button class="btn" type="submit">Register</button>
<p id="message" class="message"></p>
</form>
<p>Already registered? <a href="/login">Login</a></p>
</div>
<script>
document.getElementById("registerForm").addEventListener("submit", async (e)=>{
 e.preventDefault(); const f=new FormData(e.target);
 const r=await fetch("/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(f))});
 const d=await r.json(); if(r.ok) location.href="/dashboard"; else document.getElementById("message").textContent=d.detail||"Registration failed.";
});
</script>
{% endblock %}
